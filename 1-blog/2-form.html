<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="#">
      <h1>Регистрация</h1>
      <p>Уже сть аккаунт?<a href="#">Войти</a></p>
      <h2>Моя компания</h2>
      <div>
        <label for="name"></label>
        <input type="text" name="имя" id="name" placeholder="Имя" required />
        <label for="last_name"></label>
        <input
          type="text"
          name="last_name"
          id="last_name"
          placeholder="Фамилия"
          required />
      </div>

      <div>
        <label for="email"></label>
        <input
          type="email"
          name="Email"
          id="email"
          placeholder="E-mail"
          required />
      </div>
      <div>
        <button type="submit">Зарегистрироваться</button>
      </div>
      <div>
        <label for="agree"
          >Япрочитал и принимаю <a href="#">Условия пользования</a></label
        >
        <input type="checkbox" name="agree" id="agree" required />
      </div>
    </form>
  </body>
</html>
