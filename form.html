<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="2.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">
   
      <h1>Регистрация</h1>
      <p>Уже сть аккаунт?<a href="#" class="one">Войти</a></p>
      <h2 class="compani">Моя компания</h2>
      
      <div class="name">
        <label for="name"></label>
        <input type="text" name="имя" id="name" placeholder="Имя" required />
        <label for="last_name"></label>
        <input
          type="text"
          name="last_name"
          id="last_name"
          placeholder="Фамилия"
          required />
        </div>
        <div>
        <label for="email"></label>       
        <input
          type="email"
          name="Email"
          id="email"
          placeholder="E-mail"
          required />
      </div>
      <div >
        <button type="submit" class="button">Зарегистрироваться <span class="arrow" style="font-size: 20px";>&#x279C;</span> </button>
      </div>
      <div class="agree-forma">
        <input type="checkbox" name="agree" id="agree" required />
        <label for="agree">Япрочитал и принимаю <a href="#">Условия пользования</a></label>
        
      </div>
      </div>
   
    </main>
  </body>
</html>
