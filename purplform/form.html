<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <main>
      <h1>Свяжитесь со мной</h1>
      <div>
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" placeholder="E-mail" />
      </div>
      <label for="telegram">telegram</label>
        <input type="text"  id="telegram" placeholder="telegram" />
      </div>
      <div>
        <label for="topic">Тема</label>
        <select name="topic" id="topic" required>
            <option value="buy">Приобритение курсов</option>
            <option value="payments">Вопрос по оплате</option>
            <option value="training">Заказ тренинга</option>
        </select>
      </div>
      <div>
        <label for="comment">Коментарий</label>
        <textarea name="comment" id="comment" cols="30" rows="20" required></textarea>
      </div>
      <button>Отправить</button>
    </main>
  </body>
</html>
